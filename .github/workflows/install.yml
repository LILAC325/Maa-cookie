name: install

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  MAA_FRAMEWORK_VERSION: "v5.14.0"
  MFAA_VERSION: "v2.16.2"

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          # 检查标签格式
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          # 检查是否为预发布版本
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
            echo "This is a pre-release version"
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  windows:
    needs: meta
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
          - arch: aarch64
            runner: windows-11-arm
      fail-fast: false
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set platform variables
        id: platform
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            echo "tag=x64" >> $GITHUB_OUTPUT
          else
            echo "tag=arm64" >> $GITHUB_OUTPUT
          fi

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1.13
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-win-${{ matrix.arch }}*"
          tag: ${{ env.MAA_FRAMEWORK_VERSION }}
          out-file-path: "deps"
          extract: true

      - name: Download MFAAvalonia
        id: download_mfa
        uses: robinraju/release-downloader@v1
        with:
          repository: SweetSmellFox/MFAAvalonia
          fileName: "MFAAvalonia-*-win-${{ steps.platform.outputs.tag }}*"
          tag: ${{ env.MFAA_VERSION }}
          out-file-path: "MFA"
          extract: true

      - name: Clean up MFAAvalonia archive on Windows
        shell: bash
        run: |
          ARCHIVE_FILE_PATH="${{ fromJson(steps.download_mfa.outputs.downloaded_files)[0] }}"
          rm -f "${ARCHIVE_FILE_PATH}"
          echo "Archive cleanup command executed for MFAAvalonia on Windows."

      - name: Convert PNG to ICO
        shell: bash
        run: |
          if [ -f "assets/icon.png" ]; then
            pip install pillow -q
            python -c "from PIL import Image; img = Image.open('assets/icon.png'); img.save('logo.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(24,24),(16,16)])"
            echo "ICO generated from assets/icon.png"
          else
            echo "assets/icon.png not found, skipping icon generation"
          fi

      - name: Replace MFAAvalonia exe icon
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          EXE="MFA/MFAAvalonia.exe"
          if [ ! -f "logo.ico" ] || [ ! -f "$EXE" ]; then
            echo "Skipping icon replacement (logo.ico or MFAAvalonia.exe not found)"
            exit 0
          fi

          size_before=$(stat -c %s "$EXE")

          # rcedit 只能用在「普通 apphost」上。MFAAvalonia v2.0.0 的 win-x64 exe 曾是
          # self-contained 单文件（约 69MB，托管程序集全部内嵌在 exe 尾部），rcedit 重写
          # PE 会丢弃这段尾部 bundle，把 exe 砍成 ~190KB 的空 apphost，双击无任何反应。
          # v2.16.2 是框架依赖构建（SelfContained=false / PublishSingleFile=false），exe
          # 只有几百 KB，可安全改写。这里用体积做守卫，超过 5MB 一律跳过。
          if [ "$size_before" -gt 5000000 ]; then
            echo "MFAAvalonia.exe looks like a single-file bundle ($size_before bytes), skip rcedit"
            exit 0
          fi

          curl -L https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -o rcedit.exe
          ./rcedit.exe "$EXE" --set-icon "logo.ico"

          size_after=$(stat -c %s "$EXE")
          echo "MFAAvalonia.exe icon replaced: $size_before -> $size_after bytes"

          # 兜底：万一 rcedit 把 exe 改坏了（体积骤减），直接让构建失败而不是产出坏包。
          if [ "$size_after" -lt "$((size_before * 3 / 4))" ]; then
            echo "::error::MFAAvalonia.exe shrank unexpectedly after rcedit ($size_before -> $size_after)"
            exit 1
          fi

      # 说明：rcedit 只负责资源管理器/任务栏里 MFAAvalonia.exe 的「文件图标」。
      # 运行时的窗口图标与托盘图标由 MFAAvalonia 自己读取：
      #   1) interface.json 的 icon 字段（相对安装根目录，也就是包根的 icon.png）
      #   2) {安装目录}/Assets/logo.ico
      # 两者都由本工作流产出，见下方 Apply custom app icon 步骤。

      - name: Setup Embed Python on Windows
        shell: bash
        run: |
          python tools/ci/setup_embed_python.py
          
      - name: Download Python dependencies
        shell: bash
        run: |
          ./install/python/python.exe tools/ci/download_deps.py --deps-dir install/deps

      - name: Install
        shell: bash
        run: |
          PLATFORM_TAG="win-${{ steps.platform.outputs.tag }}"
          ./install/python/python.exe ./tools/ci/install.py ${{ needs.meta.outputs.tag }} $PLATFORM_TAG

      - name: Copy MFA files to main version
        shell: bash
        run: |
          if [ -d "MFA" ]; then
            echo "Copying MFA files to install directory..."
            mkdir -p install
            cp -rpvn MFA/. install/
          else
            echo "MFA directory not found, skipping copy."
          fi

      - name: Apply custom app icon
        shell: bash
        run: |
          # MFAAvalonia 读取窗口/托盘图标的顺序：
          #   1) interface.json 的 icon 字段（相对安装根目录，也就是包根的 icon.png）
          #   2) {安装目录}/Assets/logo.ico
          #   3) exe 内置的默认图标
          # 这里写入 Assets/logo.ico 作为兜底，且不能删掉 Assets 目录。
          mkdir -p install/Assets
          if [ -f "logo.ico" ]; then
            cp logo.ico install/Assets/logo.ico
            echo "Copied custom icon to install/Assets/logo.ico"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: Maa-cookie-win-${{ matrix.arch }}-${{ needs.meta.outputs.tag }}
          path: "install"


  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, windows, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Process and package artifacts
        run: |
          cd assets
          for f in *; do
            if [[ $f == *"win"* ]]; then
              (cd "$f" && zip -r "../$f.zip" .)
            else
              echo "Processing Unix artifact: $f"

              if [[ -f "$f/MaaPiCli" ]]; then
                chmod +x "$f/MaaPiCli"
                echo "Set execute permission for $f/MaaPiCli"
              fi

              find "$f" -type f -name "MFAAvalonia*" -exec chmod +x {} \; 2>/dev/null || true
              echo "Set execute permission for all MFAAvalonia files"

              find "$f" -type f -name "MFAUpdater*" -exec chmod +x {} \; 2>/dev/null || true
              echo "Set execute permission for all MFAUpdater files"

              PYTHON_PATHS=(
                "$f/python/bin/python3"
                "$f/python/python"
                "$f/python/bin/python"
                "$f/python/python.exe"
              )
              for PYTHON_PATH in "${PYTHON_PATHS[@]}"; do
                if [[ -f "$PYTHON_PATH" ]]; then
                  chmod +x "$PYTHON_PATH"
                  echo "Set execute permission for $PYTHON_PATH"
                fi
              done

              tar -cpzf "$f.tar.gz" -C "$f" .
              echo "Created archive with preserved permissions: $f.tar.gz"
            fi
          done
          
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          tag_name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}