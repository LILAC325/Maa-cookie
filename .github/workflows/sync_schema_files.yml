name: Sync JSON Schema Files from MaaFramework

on:
  schedule:
    - cron: '10 0 * * *'  # UTC 00:10 每天运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-schema-files:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Sync JSON schema files from MaaFramework
        run: |
          python tools/sync_schema.py

      - name: Check for changes
        id: check_status
        run: |
          git add -N tools/schema/

          if [[ -n "$(git status --porcelain tools/schema/*.schema.json tools/schema/schema-manifest.json)" ]]; then
            echo "Changes detected in JSON schema files"
            git status --porcelain tools/schema/*.schema.json tools/schema/schema-manifest.json
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected in JSON schema files"
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Changes
        if: steps.check_status.outputs.changes_detected == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tools/schema/*.schema.json tools/schema/schema-manifest.json

          git commit -m "chore: update JSON schema files from MaaFramework"

          git pull origin $(git rev-parse --abbrev-ref HEAD) --rebase
          git push

          echo "JSON schema files successfully synchronized"